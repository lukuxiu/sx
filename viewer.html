<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>考研数学 原PDF阅读器</title>
  <link rel="stylesheet" href="css/viewer.css">
  <script src="lib/pdfjs/pdf.min.js"></script>
</head>
<body>
  <div class="viewer-app">
    <!-- Topbar -->
    <header class="viewer-topbar">
      <div class="topbar-left">
        <a href="index.html" class="btn-back">‹ 考点</a>
        <div class="doc-info">
          <span class="doc-title" id="doc-title">加载中...</span>
          <span class="doc-page-info" id="page-info">第 -- 页</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-tool" id="btn-zoom-out" title="缩小">－</button>
        <button class="btn-tool" id="btn-zoom-fit" title="适应屏幕">⛶</button>
        <button class="btn-tool" id="btn-zoom-in" title="放大">＋</button>
        <a class="btn-tool" id="btn-native-open" target="_blank" title="浏览器原生打开 (批注/打印)" style="text-decoration:none;">↗</a>
      </div>
    </header>

    <!-- Page Nav Sub-bar -->
    <div class="page-nav-bar">
      <button class="page-btn" id="btn-prev">‹ 上一页</button>
      <input type="number" id="page-input" class="page-input" value="1" min="1">
      <span id="total-pages" style="color:var(--text-dim);font-size:12px;">/ --</span>
      <button class="page-btn" id="btn-next">下一页 ›</button>
    </div>

    <!-- Edge Quick Tappers for One-Hand Navigation -->
    <div id="edge-prev" class="edge-nav-btn edge-nav-left" title="上一页">‹</div>
    <div id="edge-next" class="edge-nav-btn edge-nav-right" title="下一页">›</div>

    <!-- Canvas Viewport -->
    <main class="canvas-viewport" id="canvas-viewport">
      <canvas id="pdf-canvas"></canvas>
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div>渲染原书高清页面中...</div>
      </div>
    </main>

    <!-- Killer Feature: Floating Shuttle Capsule (穿梭胶囊) -->
    <div id="shuttle-capsule" class="shuttle-capsule">
      <span id="capsule-icon" class="capsule-icon">⇄</span>
      <span id="capsule-text" class="capsule-text">穿梭对应真题/讲义</span>
    </div>
  </div>

  <script src="js/viewer.js"></script>
</body>
</html>
