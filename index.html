<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <title>Maki Math · 考研数学资料索引</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>
  <!-- App Header - Pure Search Engine Theme -->
  <header class="app-header">
    <div class="header-top">
      <div class="app-title-group">
        <span class="app-logo">Maki Math</span>
        <div>
          <div style="font-weight:700;font-size:14px;line-height:1.2;">考研数学资料索引</div>
          <div class="app-subtitle">大串讲 × 真题精解 · 一站式极速检索</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" title="切换暗色/亮色模式">🌙</button>
      </div>
    </div>

    <!-- Prominent Search Box -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" class="search-input" placeholder="搜索考点 / 题目 / 年份 / 拼音 (如: 泰勒、2015数一9、极值)..." autocomplete="off">
      <button class="search-clear" id="search-clear">✕</button>
    </div>

    <!-- Hot Search Keywords -->
    <div class="hot-search-row">
      <span class="hot-label">快捷搜索:</span>
      <span class="hot-tag" data-query="泰勒">泰勒</span>
      <span class="hot-tag" data-query="二重积分">二重积分</span>
      <span class="hot-tag" data-query="2024数一">2024数一</span>
      <span class="hot-tag" data-query="3.2">3.2</span>
      <span class="hot-tag" data-query="极值">极值</span>
      <span class="hot-tag" data-query="中值定理">中值定理</span>
      <span class="hot-tag" data-query="2015数一9">2015数一9</span>
      <span class="hot-tag" data-query="L10">L10</span>
    </div>
  </header>

  <!-- Quick Filter Navigator -->
  <nav class="filter-container">
    <!-- Perspective Switcher -->
    <div class="filter-row" style="margin-bottom: 6px;">
      <span class="filter-label">资料</span>
      <div class="chip chip-view active" data-view="all">全部资料</div>
      <div class="chip chip-view" data-view="lecture">📖 仅大串讲 (讲义)</div>
      <div class="chip chip-view" data-view="exercise">📝 仅真题分类精解</div>
    </div>
    <!-- Exam Filter -->
    <div class="filter-row" style="margin-bottom: 6px;">
      <span class="filter-label">卷别</span>
      <div class="chip chip-exam active" data-exam="all">全卷通查</div>
      <div class="chip chip-exam" data-exam="math1">数学一</div>
      <div class="chip chip-exam" data-exam="math2">数学二 (跳过20讲)</div>
      <div class="chip chip-exam" data-exam="math3">数学三</div>
    </div>
    <!-- Priority Filter -->
    <div class="filter-row">
      <span class="filter-label">筛选</span>
      <div class="chip chip-tag active" data-tag="all">全部考点</div>
      <div class="chip chip-tag chip-fire" data-tag="top_diff">🔥 难度榜 TOP12</div>
      <div class="chip chip-tag chip-warn" data-tag="key">⭐ 重点讲</div>
      <div class="chip chip-tag chip-info" data-tag="zero">💤 零命题清单 (防踩坑)</div>
      <div class="chip chip-tag" data-tag="math1_only">⚡ 仅数一专属</div>
    </div>
  </nav>

  <!-- Dynamic Banner for Math 2 / In-App Browser -->
  <div id="status-banner" style="display: none;"></div>

  <!-- Recent History Section (纯本地查阅历史) -->
  <section id="recent-section" class="recent-history-section" style="display: none;">
    <div class="recent-header">
      <div class="recent-title">
        <span>🕘</span>
        <span>最近查阅资料</span>
      </div>
      <button class="recent-clear" id="recent-clear">清空历史</button>
    </div>
    <div class="recent-chips-flow" id="recent-flow"></div>
  </section>

  <!-- Main Content Flow -->
  <main class="main-container">
    <!-- Regular Browse Area (3-level hierarchy) -->
    <div id="content-area">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div>正在加载考研大串讲与真题索引...</div>
      </div>
    </div>

    <!-- Instant Search Results Area (3-column categorization) -->
    <div id="search-results" class="search-results-section"></div>
  </main>

  <!-- Load Data and Application Logic -->
  <script src="data/math_data.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
</body>
</html>
