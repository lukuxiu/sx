<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <title>Maki 考研数学 · 随身智能复习台</title>
  <link rel="stylesheet" href="css/style.css?v=2.1">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="app-title-group">
        <span class="app-logo">Maki Math</span>
        <div>
          <div style="font-weight:700;font-size:14px;line-height:1.2;">考研数学智能复习台</div>
          <div class="app-subtitle">大串讲 ⇄ 真题精解 随身联动</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" title="切换暗色/亮色模式">🌙</button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" class="search-input" placeholder="哪里不会搜哪里：海涅、泰勒、3.1、2022数一..." autocomplete="off">
      <button class="search-clear" id="search-clear">✕</button>
    </div>
  </header>

  <!-- Quick Filter Pills -->
  <nav class="filter-container">
    <div class="filter-row" style="margin-bottom: 6px;">
      <span class="filter-label">卷别</span>
      <div class="chip chip-exam active" data-exam="all">全卷通查</div>
      <div class="chip chip-exam" data-exam="math1">数一</div>
      <div class="chip chip-exam" data-exam="math2">数二 (跳过20讲)</div>
      <div class="chip chip-exam" data-exam="math3">数三</div>
    </div>
    <div class="filter-row">
      <span class="filter-label">重点</span>
      <div class="chip chip-tag active" data-tag="all">全部考点</div>
      <div class="chip chip-tag chip-fire" data-tag="top_diff">🔥 难度榜 TOP12</div>
      <div class="chip chip-tag chip-warn" data-tag="key">⭐ 重点讲</div>
      <div class="chip chip-tag chip-info" data-tag="zero">💤 零命题清单 (防踩坑)</div>
      <div class="chip chip-tag" data-tag="math1_only">⚡ 仅数一专属</div>
    </div>
  </nav>

  <!-- Dynamic Banner (e.g. for Math 2) -->
  <div id="status-banner" style="display: none;"></div>

  <!-- Main Content Flow -->
  <main class="main-container">
    <!-- Regular Browse Area -->
    <div id="content-area">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div>正在加载考研大串讲与真题索引...</div>
      </div>
    </div>

    <!-- Instant Search Results Area -->
    <div id="search-results" class="search-results-section"></div>
  </main>

  <!-- Load Data and Application Logic -->
  <script src="data/math_data.js?v=2.1"></script>
  <script src="js/app.js?v=2.1"></script>
</body>
</html>
